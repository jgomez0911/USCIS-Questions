<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2008-2024 USCIS Questions</title>
    <link rel="stylesheet" href="style.css" ></link>
</head>
<body>
    <div id="quiz-container">
        <h2 id="question-el"></h2>
        <ul id="options-ul">
            <li id="A"></li>
            <li id="B"></li>
            <li id="C"></li>
            <li id="D"></li>
        </ul>
        <div id="short-answer-container" style="display: none;">
            <input type="text" id="answer-input" placeholder="Type your answer here">
            <button id="submit-answer">Submit</button>
        </div>
        <div id="explanation-container" style="display: none;">
            <label for="explanation-input"><b>Why is it false?</b> (Provide the correction)</label>
            <input type="text" id="explanation-input" />
            <button id="submit-explanation">Submit Explanation</button>
        </div>
        <p id="feedback-el" style="margin-top: 15px; font-weight: bold;"></p>
    </div>
    <script src="2008.js"></script>
    <script src="questions.js"></script>
</body>
</html>
