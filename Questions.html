<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2008-2024 USCIS Questions</title>
    <style>
        body {
            background-image: url("flag.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #quiz-container {
            background-color: wheat;
            width: 80%;
            max-width: 600px;
            border: 1px solid #000000;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 10px;
            border: 1px solid #000000;
            margin-top: 8px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
    </style>
</head>
<body>
    <div id="quiz-container">
        <h2 id="question-el"></h2>
        <ul id="options-ul">
            <li id="A"></li>
            <li id="B"></li>
            <li id="C"></li>
            <li id="D"></li>
        </ul>
        <div id="short-answer-container" style="display: none;">
            <input type="text" id="answer-input" placeholder="Type your answer here">
            <button id="submit-answer">Submit</button>
        </div>
        <div id="explanation-container" style="display: none;">
            <label for="explanation-input"><b>Why is it false?</b> (Provide the correction)</label>
            <input type="text" id="explanation-input" />
            <button id="submit-explanation">Submit Explanation</button>
        </div>
        <p id="feedback-el" style="margin-top: 15px; font-weight: bold;"></p>
    </div>
    <script src="questions.js"></script>
</body>
</html>
